<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- White Background Circle -->
  <circle cx="100" cy="100" r="96" fill="#ffffff" stroke="#0f172a" stroke-width="3"/>

  <g fill="none" stroke="#0f172a" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Chat Speech Bubbles (Top-Left) -->
    <rect x="52" y="36" width="32" height="20" rx="3" fill="#ffffff"/>
    <line x1="58" y1="43" x2="76" y2="43"/>
    <line x1="58" y1="49" x2="70" y2="49"/>

    <rect x="42" y="46" width="28" height="18" rx="3" fill="#ffffff"/>
    <line x1="48" y1="52" x2="63" y2="52"/>
    <line x1="48" y1="57" x2="57" y2="57"/>

    <!-- Smartphone with Question Mark (Left) -->
    <rect x="36" y="74" width="26" height="44" rx="5" fill="#ffffff"/>
    <!-- Screen Question Mark -->
    <path d="M44 87 C44 83 54 83 54 87 C54 91 49 92 49 96"/>
    <circle cx="49" cy="103" r="1" fill="#0f172a"/>

    <!-- Wi-Fi Waves (Top Center) -->
    <path d="M94 40 A 18 18 0 0 1 126 40"/>
    <path d="M100 48 A 12 12 0 0 1 120 48"/>

    <!-- Up/Down Transfer Arrows (Right) -->
    <path d="M130 84 V 64 M130 64 L 124 70 M130 64 L 136 70"/>
    <path d="M142 64 V 84 M142 84 L 136 78 M142 84 L 148 78"/>

    <!-- Support Agent Person (Center) -->
    <!-- Head & Shoulders -->
    <circle cx="100" cy="84" r="14" fill="#ffffff"/>
    <!-- Headset -->
    <path d="M84 84 A 16 16 0 0 1 116 84"/>
    <rect x="80" y="78" width="6" height="12" rx="3" fill="#0f172a"/>
    <rect x="114" y="78" width="6" height="12" rx="3" fill="#0f172a"/>
    <!-- Mic Boom -->
    <path d="M116 86 L 103 97"/>
    <circle cx="102" cy="97" r="2" fill="#0f172a"/>
    <!-- Body Shoulders Contour -->
    <path d="M78 122 C78 106 122 106 122 122 V 126 H 78 Z" fill="#ffffff"/>

    <!-- Gear with Checkmark Badge (Bottom-Right) -->
    <g transform="translate(132, 132)">
      <circle cx="0" cy="0" r="22" fill="#ffffff"/>
      <!-- Gear Teeth Outlines -->
      <path d="M -4 -25 H 4 V -20 H -4 Z"/>
      <path d="M -4 20 H 4 V 25 H -4 Z"/>
      <path d="M -25 -4 V 4 H -20 V -4 Z"/>
      <path d="M 20 -4 V 4 H 25 V -4 Z"/>
      <path d="M -18 -18 L -14 -14 M 14 14 L 18 18"/>
      <path d="M -18 18 L -14 14 M 14 -14 L 18 -18"/>
      <!-- Inner Checkmark Circle -->
      <circle cx="0" cy="0" r="15" fill="#ffffff"/>
      <path d="M -7 -1 L -2 4 L 7 -5" stroke-width="4.5"/>
    </g>
  </g>
</svg>
