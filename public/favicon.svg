<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <circle cx="50" cy="50" r="48" fill="#09090b" stroke="#ffffff" stroke-width="3"/>
  <g fill="#ffffff">
    <!-- Wrench 1: Top-Left to Bottom-Right -->
    <g transform="translate(50, 50) rotate(-45) translate(-50, -50)">
      <rect x="45" y="20" width="10" height="60" rx="3"/>
      <!-- Open Head -->
      <path d="M 36 20 C 36 10, 64 10, 64 20 C 64 26, 56 28, 50 28 C 44 28, 36 26, 36 20 Z"/>
      <path d="M 43 10 L 50 22 L 57 10 Z" fill="#09090b"/>
      <!-- Ring Head with Hexagon -->
      <circle cx="50" cy="80" r="12"/>
      <polygon points="50,73 56,77 56,83 50,87 44,83 44,77" fill="#09090b"/>
    </g>
    <!-- Wrench 2: Top-Right to Bottom-Left -->
    <g transform="translate(50, 50) rotate(45) translate(-50, -50)">
      <rect x="45" y="20" width="10" height="60" rx="3"/>
      <!-- Open Head -->
      <path d="M 36 20 C 36 10, 64 10, 64 20 C 64 26, 56 28, 50 28 C 44 28, 36 26, 36 20 Z"/>
      <path d="M 43 10 L 50 22 L 57 10 Z" fill="#09090b"/>
      <!-- Ring Head with Hexagon -->
      <circle cx="50" cy="80" r="12"/>
      <polygon points="50,73 56,77 56,83 50,87 44,83 44,77" fill="#09090b"/>
    </g>
  </g>
</svg>
